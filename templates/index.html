<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Movie Site - Latest Movies</title>
    <meta name="description"
          content="Discover the latest movies, release dates, ratings and movie information.">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            padding: 25px;
            text-align: center;
            background: #181818;
        }

        header h1 {
            margin: 0;
        }

        header p {
            color: #aaa;
        }

        .movies {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            padding: 25px;
            max-width: 1200px;
            margin: auto;
        }

        .movie {
            background: #1d1d1d;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .movie:hover {
            transform: translateY(-5px);
        }

        .movie-link {
            display: block;
            color: white;
            text-decoration: none;
        }

        .movie img {
            width: 100%;
            height: 270px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }

        .movie-info {
            padding: 12px;
        }

        .movie-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .movie-meta {
            color: #aaa;
            font-size: 14px;
        }

        .watch-area {
            padding: 0 12px 12px 12px;
        }

        .watch {
            display: block;
            padding: 10px;
            text-align: center;
            background: #e50914;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .watch:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

<header>
    <h1>My Movie Site</h1>
    <p>Latest Movies & Movie Information</p>
</header>

<main class="movies">

    {% for movie in movies %}

    <article class="movie">

        <!-- Poster and movie information link to our detail page -->
        <a
            class="movie-link"
            href="{{ movie.detail_url }}"
        >

            <img
                src="{{ movie.poster_url }}"
                alt="{{ movie.title }}"
                loading="lazy"
            >

            <div class="movie-info">

                <div class="movie-title">
                    {{ movie.title }}
                </div>

                <div class="movie-meta">
                    {{ movie.release_date }}

                    {% if movie.status_or_rating %}
                        · {{ movie.status_or_rating }}
                    {% endif %}
                </div>

            </div>

        </a>

        <!-- Watch button goes directly to Cinejoy -->
        <div class="watch-area">

            <a
                class="watch"
                href="{{ movie.watch_url }}"
                target="_blank"
                rel="nofollow noopener"
            >
                WATCH ONLINE
            </a>

        </div>

    </article>

    {% endfor %}

</main>

</body>
</html>
